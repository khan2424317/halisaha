<div class="hakkimizda">

    <div class="hakkimizdasayfa">
        <a class="box" href="halisaha.html">Ana Sayfa</a>
        <a class="box" href="hakkimizda.html">Hakkımızda</a>
        <a class="box" href="halisaha.html#halisahalar">Halısahalar</a>

<form id="form" class="balon">
    <h2>Bize Ulaşın</h2>

    <label for="isim">İsim</label>
    <input type="text" id="isim" required>

    <label for="soyisim">Soyisim</label>
    <input type="text" id="soyisim" required>

    <label for="no">İletişim Numarası</label>
    <input type="tel" id="no" >

    <label for="email">E-posta</label>
    <input type="email" id="email" required>

    <label for="date">Doğum Tarihi</label>
    <input type="date" id="date">

    <label for="mesaj">Eklemek istedikleriniz</label>
    <textarea id="mesaj"></textarea>

    <button type="submit" class="gonder">Gönder</button>
</form>

</body>
